# Match-3 Earn — build the release APK on GitHub Actions (Gradle works here;
# it cannot run in the sandbox, where loopback TCP is blocked).
#
# Produces app-release.apk signed with the SAME debug keystore as the manual
# builds, so it installs as an update over the v7/v8 on the user's phone.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64          base64 of manual-build/debug.keystore
#                            (set with: base64 -w0 debug.keystore | gh secret set KEYSTORE_BASE64)
#   SUPABASE_URL             e.g. https://kwnjpmaecdaewdpqwoww.supabase.co
#   SUPABASE_ANON_KEY        the anon (public) key from Project Settings -> API
# Optional repo secrets (build falls back to Google's TEST IDs if unset):
#   ADMOB_APP_ID             real AdMob app ID (ca-app-pub-...~...)
#   ADMOB_REWARDED_AD_UNIT_ID  real rewarded ad unit ID (ca-app-pub-.../...)
# NEVER add the Supabase service_role key as a secret here — it is only
# ever pasted by hand into cashout-server/admin.html.
#
# Verification gates (the job FAILS if any of them fails):
#   - apksigner verifies the APK (v2 + v3 signatures)
#   - aapt2 dump badging shows the right package / version
#   - NO androidx/appcompat string anywhere in the dex (the user's phone
#     refuses to launch apps containing AppCompat — see README.md)

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default packages list includes the obsolete `tools`
          # package, which no longer exists in Google's repository — run
          # 44466601035 failed on it ("Failed to find package 'tools'").
          # platform-tools is all this step needs; the platform and
          # build-tools are installed by the next step.
          packages: platform-tools

      - name: Install platform 36 + build-tools 36.0.0
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. See README.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/debug.keystore
          ls -la app/debug.keystore

      - name: Inject Supabase config (or keep offline placeholders)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            python3 tools/inject_supabase_config.py
          else
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY not set — APK will play offline only."
          fi
          python3 tools/inline_config.py \
            app/src/main/assets/public/index.html \
            app/src/main/assets/public/supabase-config.js \
            app/src/main/assets/public/ads-config.js

      - name: Build release APK
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
        run: |
          EXTRA=""
          if [ -n "$ADMOB_APP_ID" ]; then EXTRA="$EXTRA -PadmobAppId=$ADMOB_APP_ID"; fi
          if [ -n "$ADMOB_REWARDED_AD_UNIT_ID" ]; then EXTRA="$EXTRA -PadmobRewardedAdUnitId=$ADMOB_REWARDED_AD_UNIT_ID"; fi
          ./gradlew assembleRelease --stacktrace $EXTRA

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          ls -la "$APK"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt2" dump badging "$APK" | head -8
          # HARD GATE: no AppCompat anywhere in the dex. The user's Redmi 13C
          # refuses to launch apps containing AppCompat (verified by bisect).
          mkdir -p /tmp/apkcheck && cd /tmp/apkcheck
          unzip -o -q "$GITHUB_WORKSPACE/$APK" "classes*.dex"
          if strings classes*.dex | grep -q "androidx/appcompat"; then
            echo "::error::APPCOMPAT FOUND in dex — this APK would not launch on the user's phone."
            exit 1
          fi
          echo "dex check passed: no androidx/appcompat references"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: match-3-earn-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
